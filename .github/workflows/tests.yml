name: OELP model tests

on:
  pull_request:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal model-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=1.24,<3" \
            "pandas>=2,<4" \
            "scipy>=1.11,<2" \
            "scikit-learn>=1.3,<2" \
            "joblib>=1.2" \
            "pytest>=7.4"

      - name: Run analytics, inference, and model tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests
