openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Historical OELP customer-retention analytics API.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analytics
    description: Historical customer and forecast analytics
  - name: uploads
    description: In-memory descriptive analysis of uploaded transactions
  - name: behavior
    description: Historical, cutoff-safe customer behavior monitoring
  - name: revenue-exposure
    description: Model disagreements, nullable exposure, and historical reliability evidence
  - name: retention
    description: Deterministic screening rankings and hypothetical retention scenarios
  - name: trajectories
    description: Exposure-aware historical customer trajectories and research
  - name: research
    description: Final, evidence-linked summaries of the 11 research notebooks
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health:
    get:
      operationId: getApiHealth
      tags: [health]
      summary: Health check for the Replit preview
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /overview:
    get:
      operationId: getOverview
      tags: [analytics]
      summary: Get historical business performance and forecast totals
      parameters:
        - name: start_date
          in: query
          schema: { type: string, format: date }
        - name: end_date
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Business overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewResponse"
  /segments:
    get:
      operationId: getSegments
      tags: [analytics]
      summary: Get descriptive and forecast-time segment summaries
      responses:
        "200":
          description: Segment summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentOverview"
  /customers:
    get:
      operationId: getCustomers
      tags: [analytics]
      summary: Search and paginate customers
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: search
          in: query
          schema: { type: string }
        - name: retrospective_segment
          in: query
          schema: { type: string }
        - name: hist_segment
          in: query
          schema: { type: string }
        - name: history_group
          in: query
          description: Filter by purchase-history group measured at the forecast cutoff.
          schema:
            type: string
            enum: [Exactly one purchase, Two to four purchases, Five or more purchases]
      responses:
        "200":
          description: Paged customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerPage"
  /behavior/summary:
    get:
      operationId: getBehaviorSummary
      tags: [behavior]
      summary: Summarize cutoff-safe behavior indicators
      responses:
        "200":
          description: Behavior monitoring summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BehaviorSummary"
  /behavior/customers:
    get:
      operationId: getBehaviorCustomers
      tags: [behavior]
      summary: Filter and sort the historical behavior cohort
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: search
          in: query
          schema: { type: string }
        - name: hist_segment
          in: query
          schema: { type: string }
        - name: history_group
          in: query
          schema: { type: string }
        - name: history_sufficiency
          in: query
          schema: { type: string, enum: [sufficient, limited, insufficient] }
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [current_elapsed_gap_days, gap_deviation_score, purchase_rate_ratio, revenue_rate_ratio, personalized_delay_ratio, recency]
            default: current_elapsed_gap_days
        - name: sort_direction
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: Filtered historical behavior customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BehaviorCustomerPage"
  /behavior/evaluation:
    get:
      operationId: getBehaviorEvaluation
      tags: [behavior]
      summary: Get versioned behavior-monitoring evaluation results
      responses:
        "200":
          description: Saved TRAIN/VAL/TEST behavior evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BehaviorEvaluation"
  /customers/{customer_id}/behavior:
    get:
      operationId: getCustomerBehavior
      tags: [behavior]
      summary: Get a customer's cutoff-time behavior indicators
      parameters:
        - name: customer_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Customer behavior indicators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BehaviorCustomerDetail"
        "404":
          description: Customer not found in the eligible historical cohort
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /customers/{customer_id}/behavior/trajectory:
    get:
      operationId: getCustomerBehaviorTrajectory
      tags: [behavior]
      summary: Get a customer's pre-cutoff purchasing trajectory
      parameters:
        - name: customer_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Historical customer behavior trajectory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BehaviorTrajectoryResponse"
        "404":
          description: Customer not found in the eligible historical cohort
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /customers/{customer_id}:
    get:
      operationId: getCustomer
      tags: [analytics]
      summary: Get an eligible customer's historical profile
      parameters:
        - name: customer_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Customer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerProfile"
        "404":
          description: Customer not found in the eligible historical cohort
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /customers/{customer_id}/history:
    get:
      operationId: getCustomerHistory
      tags: [analytics]
      summary: Get a customer's orders before the historical cutoff
      parameters:
        - name: customer_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Historical orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseOrder"
  /customers/{customer_id}/forecast:
    get:
      operationId: getCustomerForecast
      tags: [analytics]
      summary: Get saved-model forecast values for one customer
      parameters:
        - name: customer_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Saved-model forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerForecast"
        "404":
          description: Customer not found in the eligible historical cohort
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /forecasts/summary:
    get:
      operationId: getForecastSummary
      tags: [analytics]
      summary: Compare saved-model forecasts for a historical cohort
      parameters:
        - name: hist_segment
          in: query
          schema: { type: string }
        - name: history_group
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Cohort forecast summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastSummary"
  /model-performance:
    get:
      operationId: getModelPerformance
      tags: [analytics]
      summary: Get evaluation metrics exported from saved Notebook 06 and 07 outputs
      responses:
        "200":
          description: Validated model-performance metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPerformance"
  /reliability/summary:
    get:
      operationId: getReliabilitySummary
      tags: [analytics]
      summary: Get fixed-cutoff purchase calibration and evaluation scope
      responses:
        "200":
          description: Aggregate reliability summary; no per-customer TEST outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReliabilitySummary"
        "503":
          description: Reliability artifacts are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /reliability/calibration:
    get:
      operationId: getReliabilityCalibration
      tags: [analytics]
      summary: Get purchase calibration bins and validation-selected bin methods
      responses:
        "200":
          description: Calibration data for supported horizons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReliabilityCalibration"
  /reliability/subgroups:
    get:
      operationId: getReliabilitySubgroups
      tags: [analytics]
      summary: Get supported historical reliability subgroup diagnostics
      parameters:
        - name: horizon_days
          in: query
          required: false
          schema:
            type: integer
            enum: [30, 60, 90]
      responses:
        "200":
          description: Aggregate subgroup diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReliabilitySubgroups"
  /reliability/revenue:
    get:
      operationId: getReliabilityRevenue
      tags: [analytics]
      summary: Get aggregate TEST expected-revenue accuracy and sensitivity
      responses:
        "200":
          description: Aggregate revenue metrics and subgroup summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReliabilityRevenue"
  /research/summary:
    get:
      operationId: getResearchSummary
      tags: [research]
      summary: Get the read-only final research evaluation
      description: Returns aggregate saved research evidence only; it does not include customer-level TEST outcomes or load model artifacts.
      responses:
        "200":
          description: Final research evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalResearchSummary"
        "503":
          description: The generated summary is missing, stale, or invalid
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /customers/{customer_id}/explanation:
    get:
      operationId: getCustomerExplanation
      tags: [analytics]
      summary: Explain saved customer forecasts against TRAIN-only references
      parameters:
        - name: customer_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: horizon_days
          in: query
          required: false
          schema:
            type: integer
            enum: [30, 60, 90]
            default: 30
      responses:
        "200":
          description: Saved forecast explanation without outcome labels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerExplanation"
        "404":
          description: Customer is not in the eligible pre-cutoff cohort
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Saved model or reference artifacts are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /customers/{customer_id}/reliability:
    get:
      operationId: getCustomerReliability
      tags: [analytics]
      summary: Get group-level reliability context and input-support flags
      parameters:
        - name: customer_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: horizon_days
          in: query
          required: false
          schema:
            type: integer
            enum: [30, 60, 90]
            default: 30
      responses:
        "200":
          description: Historical group reliability and distribution support context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerReliability"
        "404":
          description: Customer is not in the eligible pre-cutoff cohort
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Saved reliability artifacts are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /model-performance/calibration:
    get:
      operationId: getCalibrationImage
      tags: [analytics]
      summary: Get the saved purchase-clock calibration image
      responses:
        "200":
          description: Saved calibration chart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalibrationAsset"
  /model-performance/calibration-90d:
    get:
      operationId: getCalibration90dImage
      tags: [analytics]
      summary: Get the saved 90-day calibration image
      responses:
        "200":
          description: Saved 90-day calibration chart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalibrationAsset"
  /model-performance/assets/{filename}:
    get:
      operationId: getCalibrationAssetFile
      tags: [analytics]
      summary: Get an allowlisted saved calibration plot
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Saved calibration plot image
          content:
            image/png:
              schema: { type: string, format: binary }
  /revenue-exposure/summary:
    get:
      operationId: getRevenueExposureSummary
      tags: [revenue-exposure]
      summary: Summarize saved revenue forecasts and exposure feasibility
      description: Returns portfolio totals, explicit model disagreement, and a nullable reference-based exposure estimate.
      parameters:
        - name: horizon_days
          in: query
          schema: { type: integer, enum: [30, 60, 90], default: 30 }
      responses:
        "200":
          description: Revenue-exposure portfolio summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevenueExposureSummary" }
  /revenue-exposure/customers:
    get:
      operationId: getRevenueExposureCustomers
      tags: [revenue-exposure]
      summary: Rank and filter forecast-time customer candidates
      parameters:
        - name: horizon_days
          in: query
          schema: { type: integer, enum: [30, 60, 90], default: 30 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: ranking_strategy
          in: query
          schema:
            type: string
            enum: [historical_gross_spending, recency_only, nonreturn_probability, conditional_expected_spending, nonreturn_spending_proxy, pareto_risk_value]
            default: nonreturn_spending_proxy
        - name: hist_segment
          in: query
          schema: { type: string }
        - name: history_group
          in: query
          schema: { type: string }
        - name: history_sufficiency
          in: query
          schema: { type: string, enum: [sufficient, limited, insufficient] }
        - name: require_sufficient_behavior_history
          in: query
          schema: { type: boolean, default: false }
        - name: behavior_filter
          in: query
          schema:
            type: string
            enum: [none, declining_purchase_rate, declining_revenue_rate]
            default: none
        - name: search
          in: query
          schema: { type: string, maxLength: 32, pattern: "^[0-9]*$" }
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [priority_rank, customer_id, recency_days, purchase_probability, conditional_expected_spending_gbp, personalized_expected_revenue_gbp, nonreturn_weighted_conditional_spending_proxy_gbp, historical_gross_spending_gbp]
            default: priority_rank
        - name: sort_descending
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Filtered, deterministically ranked customer page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevenueCustomerPage" }
  /revenue-exposure/scatter:
    get:
      operationId: getRevenueExposureScatter
      tags: [revenue-exposure]
      summary: Return risk-and-value points for an interactive scatter plot
      parameters:
        - name: horizon_days
          in: query
          schema: { type: integer, enum: [30, 60, 90], default: 30 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 3373, default: 1000 }
        - name: hist_segment
          in: query
          schema: { type: string }
        - name: history_sufficiency
          in: query
          schema: { type: string, enum: [sufficient, limited, insufficient] }
      responses:
        "200":
          description: Customer forecast points, with the screening proxy clearly labeled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevenueScatterResponse" }
  /revenue-exposure/concentration:
    get:
      operationId: getRevenueExposureConcentration
      tags: [revenue-exposure]
      summary: Compare financial concentration across saved forecast measures
      parameters:
        - name: horizon_days
          in: query
          schema: { type: integer, enum: [30, 60, 90], default: 30 }
      responses:
        "200":
          description: Top-customer concentration rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevenueConcentrationResponse" }
  /revenue-exposure/evaluation:
    get:
      operationId: getRevenueExposureEvaluation
      tags: [revenue-exposure]
      summary: Read Notebook 10 aggregate research results
      responses:
        "200":
          description: Leakage-aware validation and TEST evaluation; aggregate results only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevenueExposureEvaluation" }
  /customers/{customer_id}/revenue-exposure:
    get:
      operationId: getRevenueExposureCustomer
      tags: [revenue-exposure]
      summary: Get saved forecast, proxy, behavior, and reliability context for one customer
      parameters:
        - name: customer_id
          in: path
          required: true
          schema: { type: integer, exclusiveMinimum: 0 }
        - name: horizon_days
          in: query
          schema: { type: integer, enum: [30, 60, 90], default: 30 }
      responses:
        "200":
          description: Forecast-time customer detail and interpretation limits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevenueCustomerDetail" }
        "404":
          description: Customer is not in the eligible forecast cohort
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /retention/scenarios:
    post:
      operationId: postRetentionScenario
      tags: [retention]
      summary: Simulate a contact budget under explicit hypothetical assumptions
      description: Does not estimate causal treatment effects or promise recovered revenue.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetentionScenarioRequest" }
      responses:
        "200":
          description: Hypothetical, noncausal contact allocation and customer list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionScenarioResponse" }
        "400":
          description: Invalid scenario or ranking strategy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /retention/compare-strategies:
    post:
      operationId: postRetentionStrategyComparison
      tags: [retention]
      summary: Compare candidate screening strategies under shared assumptions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetentionStrategyComparisonRequest" }
      responses:
        "200":
          description: Strategy allocations under one shared hypothetical scenario
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionStrategyComparisonResponse" }
        "400":
          description: Invalid scenario or ranking strategy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /upload/preview:
    post:
      operationId: previewUpload
      tags: [uploads]
      summary: Read upload headers and sample rows in memory
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadPreviewRequest"
      responses:
        "200":
          description: Upload preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadPreview"
        "400":
          description: Invalid or unsupported upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /upload/analyze:
    post:
      operationId: analyzeUpload
      tags: [uploads]
      summary: Validate and analyze an upload descriptively without saving it
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadAnalysisRequest"
      responses:
        "200":
          description: Descriptive upload analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadAnalysis"
        "400":
          description: Invalid upload, mapping, or transaction history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /upload/export:
    post:
      operationId: exportUpload
      tags: [uploads]
      summary: Reprocess an in-memory upload and return a CSV download
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadExportRequest"
      responses:
        "200":
          description: Cleaned transactions or descriptive customer features
          content:
            text/csv:
              schema: { type: string }
        "400":
          description: Invalid upload or mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /trajectories/summary:
    get:
      operationId: getTrajectorySummary
      tags: [trajectories]
      summary: Summarize historical trajectory eligibility and method support
      responses:
        "200":
          description: Trajectory cohort summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrajectorySummary"
        "503":
          description: Trajectory source data is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /trajectories/clusters:
    get:
      operationId: getTrajectoryClusters
      tags: [trajectories]
      summary: Return available frozen trajectory cluster profiles
      responses:
        "200":
          description: Historical trajectory cluster profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrajectoryClustersResponse"
  /trajectories/customers:
    get:
      operationId: getTrajectoryCustomers
      tags: [trajectories]
      summary: Search and paginate historical customer trajectories
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: search
          in: query
          schema: { type: string, maxLength: 16, pattern: "^[0-9]*$" }
        - name: history_sufficiency
          in: query
          schema:
            type: string
            enum: [sufficient_for_functional_analysis, sufficient_for_summary_trajectory, limited_history, insufficient_history]
        - name: hist_segment
          in: query
          schema: { type: string, maxLength: 80 }
        - name: cluster_id
          in: query
          schema: { type: integer, minimum: 0, maximum: 5 }
      responses:
        "200":
          description: Filtered historical trajectory customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrajectoryCustomerPage"
        "422":
          description: Invalid filter or pagination value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /trajectories/evaluation:
    get:
      operationId: getTrajectoryEvaluation
      tags: [trajectories]
      summary: Return saved historical trajectory evaluation results
      responses:
        "200":
          description: Evaluation findings and availability status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrajectoryEvaluationResponse"
  /customers/{customer_id}/trajectory:
    get:
      operationId: getCustomerTrajectory
      tags: [trajectories]
      summary: Return a customer's pre-cutoff trajectory
      parameters:
        - name: customer_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Customer trajectory and support details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerTrajectoryResponse"
        "404":
          description: Customer is outside the historical trajectory cohort
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /customers/{customer_id}/trajectory/explanation:
    get:
      operationId: getCustomerTrajectoryExplanation
      tags: [trajectories]
      summary: Explain supported historical trajectory summaries
      parameters:
        - name: customer_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Noncausal description of historical trajectory indicators
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerTrajectoryExplanation"
        "404":
          description: Customer is outside the historical trajectory cohort
          content:
            application/json:
              schema:
